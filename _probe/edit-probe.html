<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
    --accent: #10b981; --accent-strong: #0d9e6f; --accent-soft: rgba(16,185,129,.10);
    --bg-app: #f6f7f9; --bg-surface: #ffffff; --bg-sidebar: #f1f2f4;
    --border: #eceef1; --border-strong: #dde1e6; --text: #1f2328;
    --text-muted: #6e7781; --code-bg: #f6f8fa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; color: var(--text); -webkit-font-smoothing: antialiased; }

/* ---------- copied from index.html ---------- */
.md-body {
    padding: 6px;
    line-height: 1.8;
    font-size: 17px;
    overflow-wrap: break-word;
}
.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
    margin: 1.2em 0 0.55em; font-weight: 700; line-height: 1.3;
}
.md-body h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
.md-body h2 { font-size: 1.4em; border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent); padding-bottom: 0.22em; }
.md-body h3 { font-size: 1.2em; }
.md-body h4 { font-size: 1.05em; }
.md-body p { margin: 0.7em 0; }
.md-body p.md-empty { min-height: 1.4em; margin: 0; }
.md-body ul, .md-body ol { margin: 0.7em 0; padding-left: 1.6em; }
.md-body li { margin: 0.3em 0; }
.md-body ul li::marker { color: var(--accent-strong); }
.md-body blockquote {
    position: relative; border-left: 3px solid var(--accent);
    background: var(--accent-soft); margin: 0.9em 0; padding: 0.5em 1.1em;
    color: var(--text-muted); border-radius: 0 8px 8px 0;
}
.blk { border-radius: 4px; }

.line-inline {
    width: 100%;
    height: auto;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    font-style: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    padding: 0;
    margin: 0;
    outline: none;
    resize: none;
    overflow: hidden;
    box-shadow: none;
    box-sizing: border-box;
    vertical-align: baseline;
    white-space: pre-wrap;
    cursor: text;
    field-sizing: content;
}
.line-inline.block-inline {
    min-height: 100px;
    font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
    font-size: 17px;
    white-space: pre;
    field-sizing: normal;
}
/* ---------- probe helpers ---------- */
#probe { padding: 40px; }
.case { margin-bottom: 34px; }
.case-title { font-size: 13px; color: #888; margin-bottom: 6px; }
.ref-line { height: 2px; background: #ccc; }
#out { white-space: pre; font: 12px Consolas, monospace; margin: 20px 0 0; }
</style>
</head>
<body>
<div id="probe"></div>
<pre id="out"></pre>
<script>
// Build one probe case: rendered row (as md-parser would emit) inside .blk, with reference lines above/below.
function makeCase(label, rowHtml, srcLine, rowSelector) {
    const wrap = document.createElement('div')
    wrap.className = 'case'
    const title = document.createElement('div'); title.className = 'case-title'; title.textContent = label
    const refTop = document.createElement('div'); refTop.className = 'ref-line'
    const blk = document.createElement('div'); blk.className = 'blk'
    blk.innerHTML = rowHtml
    const refBottom = document.createElement('div'); refBottom.className = 'ref-line'
    wrap.append(title, refTop, blk, refBottom)
    document.getElementById('probe').appendChild(wrap)
    return { blk, refTop, refBottom, row: blk.querySelector(rowSelector), srcLine }
}

const cases = [
    // (label, rowHtml, source markdown line, rowSelector)
    makeCase('H1 标题', '<h1>一级标题文字测试</h1>', '# 一级标题文字测试', 'h1'),
    makeCase('H2 标题', '<h2>二级标题文字测试</h2>', '## 二级标题文字测试', 'h2'),
    makeCase('H3 标题', '<h3>三级标题文字测试</h3>', '### 三级标题文字测试', 'h3'),
    makeCase('单行段落', '<p>普通段落文字内容，用来测试编辑时是否位移。</p>', '普通段落文字内容，用来测试编辑时是否位移。', 'p'),
    makeCase('多行段落第1行', '<p><span class="md-line">第一行软换行内容测试</span><br>\n<span class="md-line">第二行内容测试</span></p>', '第一行软换行内容测试', 'span.md-line'),
    makeCase('多行段落第2行', '<p><span class="md-line">第一行软换行内容测试</span><br>\n<span class="md-line">第二行内容测试</span></p>', '第二行内容测试', 'span.md-line'),
    makeCase('列表项', '<ul><li>列表项内容文字测试</li></ul>', '- 列表项内容文字测试', 'li'),
    makeCase('引用块', '<blockquote><p>引用内容文字测试</p></blockquote>', '> 引用内容文字测试', 'blockquote p'),
]

function rect(r) { return { top: r.top, bottom: r.bottom, height: r.height, left: r.left, width: r.width } }

function textRange(el) {
    const r = document.createRange()
    // select first text node contents
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT)
    const first = walker.nextNode()
    if (!first) return null
    r.setStart(first, 0)
    r.setEnd(first, first.data.length)
    return r
}

function measureBefore(c) {
    const rowRect = c.row.getBoundingClientRect()
    const range = textRange(c.row)
    const txt = range ? range.getBoundingClientRect() : null
    const refTopRect = c.refTop.getBoundingClientRect()
    const refBotRect = c.refBottom.getBoundingClientRect()
    return {
        row: rect(rowRect),
        text: txt ? rect(txt) : null,
        gapTopText: txt ? txt.top - refTopRect.bottom : null,   // 文本到上方参考线距离
        gapRowBot: refBotRect.top - rowRect.bottom,             // 行底到下方参考线距离
    }
}

function openEdit(c) {
    const ta = document.createElement('textarea')
    ta.className = 'line-inline'
    ta.value = c.srcLine
    ta.spellcheck = false
    ta.wrap = 'off'
    const range = document.createRange()
    range.selectNodeContents(c.row)
    range.deleteContents()
    range.insertNode(ta)
    return ta
}

function measureAfter(c, ta) {
    const taRect = ta.getBoundingClientRect()
    const refTopRect = c.refTop.getBoundingClientRect()
    const refBotRect = c.refBottom.getBoundingClientRect()
    return {
        ta: rect(taRect),
        gapTopTa: taRect.top - refTopRect.bottom,   // textarea 盒顶到上方参考线
        gapRowBot: refBotRect.top - taRect.bottom,  // textarea 盒底到下方参考线
    }
}

const lines = []
for (const c of cases) {
    const before = measureBefore(c)
    const ta = openEdit(c)
    const after = measureAfter(c, ta)
    const textTopDelta = before.text ? (after.gapTopTa - before.gapTopText) : NaN
    lines.push(
        c.label + '\n' +
        '  渲染: rowH=' + before.row.height.toFixed(2) + ' 文本top距参考=' + before.gapTopText.toFixed(2) + '\n' +
        '  编辑: taH =' + after.ta.height.toFixed(2) + ' ta top距参考=' + after.gapTopTa.toFixed(2) + '\n' +
        '  文本垂直位移(编辑-渲染) = ' + textTopDelta.toFixed(2) + ' px\n' +
        '  行高变化(ta-row)       = ' + (after.ta.height - before.row.height).toFixed(2) + ' px'
    )
}
document.getElementById('out').textContent = lines.join('\n\n')
window.__PROBE_DONE__ = true
</script>
</body>
</html>
